<html lang="fr">
<head>

<style>
:root{
  --bg:#eef2f1; --ink:#1c2422; --muted:#56615d; --line:#d3dbd7; --card:#ffffff; --soft:#f6f2e7; --grey:#8b918e;
  --serif:"Alegreya", Georgia, serif; --sans:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#141a19; --ink:#e7ecea; --muted:#a4b0ab; --line:#2f3a37; --card:#1d2523; --soft:#26302d; } }
:root[data-theme="dark"]{ --bg:#141a19; --ink:#e7ecea; --muted:#a4b0ab; --line:#2f3a37; --card:#1d2523; --soft:#26302d; }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.45; display:flex; flex-direction:column; }
header{ display:flex; align-items:center; gap:10px 22px; flex-wrap:wrap; padding:10px 18px; border-bottom:1px solid var(--line); }
header h1{ font-family:var(--serif); font-size:26px; margin:0; line-height:1; }
header .sum{ color:var(--muted); }
.route{ display:flex; gap:6px; flex-wrap:wrap; }
.chip{ font:inherit; font-size:15px; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:20px; padding:3px 10px 3px 4px; cursor:pointer; }
.chip b{ display:inline-grid; place-items:center; min-width:22px; height:22px; padding:0 5px; border-radius:11px; color:#fff; font-size:12px; }
.chip:hover{ border-color:var(--muted); }
.tools{ margin-left:auto; display:flex; gap:8px; align-items:center; color:var(--muted); font-size:14px; }
.btn{ font:inherit; font-size:14px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:5px 10px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:5px; }
.btn:hover{ border-color:var(--muted); }
main{ flex:1; display:grid; grid-template-columns:minmax(0,1.6fr) minmax(340px,1fr); min-height:0; }
#map{ height:100%; min-height:420px; background:#dce8ef; }
#panel{ overflow-y:auto; padding:14px 16px 40px; border-left:1px solid var(--line); }
.group{ margin-bottom:10px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
.group > summary{ list-style:none; cursor:pointer; padding:10px 12px; display:flex; align-items:center; gap:10px; }
.group > summary::-webkit-details-marker{ display:none; }
.group > summary .badge{ min-width:30px; height:30px; font-size:14px; }
.group h2{ font-family:var(--serif); font-size:21px; margin:0; line-height:1.1; }
.group .meta{ color:var(--muted); font-size:14px; }
.group .count{ margin-left:auto; color:var(--muted); font-size:14px; white-space:nowrap; }
.cards{ display:flex; flex-direction:column; gap:8px; padding:0 10px 10px; }
.badge{ display:inline-grid; place-items:center; min-width:26px; height:26px; padding:0 6px; border-radius:13px; color:#fff; font-weight:700; font-size:12px; flex:none; }
.card{ border:1px solid var(--line); border-radius:10px; background:var(--bg); padding:9px 10px; scroll-margin:14px; transition:box-shadow .2s, border-color .2s; }
.card.hl{ border-color:var(--ink); box-shadow:0 0 0 3px rgba(31,95,153,.35); }
.card .top{ display:flex; align-items:center; gap:8px; cursor:pointer; }
.card h3{ margin:0; font-size:18px; font-weight:700; line-height:1.15; }
.card .st{ margin-left:auto; font-size:13px; color:var(--muted); white-space:nowrap; }
.card .st.must{ color:#b5541c; font-weight:700; }
.card img{ display:block; width:100%; max-height:220px; object-fit:cover; border-radius:8px; margin-top:8px; background:var(--soft); }
.card p{ margin:6px 0 0; font-size:16px; }
.links{ display:flex; flex-direction:column; gap:4px; margin-top:7px; }
.links a{ color:var(--ink); font-size:15px; text-decoration:none; border-left:3px solid var(--line); padding:2px 0 2px 8px; }
.links a:hover{ border-left-color:var(--ink); }
.links a span{ color:var(--muted); font-size:13px; }
.acts{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.msg{ padding:16px; color:var(--muted); }
.warn{ margin:0 0 10px; padding:8px 10px; border-radius:8px; background:#fff4e5; color:#6b3d00; font-size:14px; }
footer{ padding:6px 18px; color:var(--muted); font-size:13px; border-top:1px solid var(--line); display:flex; gap:14px; flex-wrap:wrap; }
.hubpin{ display:grid; place-items:center; border-radius:50%; color:#fff; font-weight:700; font-size:13px; border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); font-family:var(--sans); }
.carpin{ font-size:18px; background:#fff; border-radius:50%; width:30px; height:30px; display:grid; place-items:center; border:1.5px solid #bbb; }
.leaflet-popup-content{ font-family:var(--sans); font-size:15px; margin:10px 12px; }
.leaflet-popup-content img{ width:200px; max-height:130px; object-fit:cover; border-radius:6px; display:block; margin-bottom:6px; }
.leaflet-popup-content .pbtn{ margin-top:6px; }
@media (max-width:900px){ main{ grid-template-columns:1fr; } #map{ height:55vh; } #panel{ border-left:0; border-top:1px solid var(--line); overflow:visible; } body{ display:block; } }
</style>
</head>
<body>
<header>
  <h1>Italie 2027</h1>
  <span class="sum" id="sum">Chargement…</span>
  <nav class="route" id="route" aria-label="Trajet"></nav>
  <div class="tools">
    <label><input type="checkbox" id="showOther" checked> Ailleurs</label>
    <button class="btn" id="reload" title="Relire la feuille Google">↻ Recharger</button>
  </div>
</header>
<main>
  <div id="map" role="region" aria-label="Carte"></div>
  <section id="panel" aria-live="polite"><div class="msg">Lecture de la feuille Google…</div></section>
</main>
<footer>
  <span>Version 0.3 · 6 octobre 2026</span>
  <span id="stamp"></span>
  <span>Trait plein : train · pointillé : avion · 🚗 : auto</span>
  <a href="v0.2/" style="color:inherit">Ancienne version (3 scénarios)</a>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---- Italie 2027 v0.3 : data logic (no DOM) ----
const RADIUS_KM = 40; // a place farther than this from every hub goes to "Ailleurs"

function parseCSV(text) {
  const rows = []; let row = [], field = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  const head = (rows.shift() || []).map((h) => h.trim());
  return rows.filter((r) => r.some((v) => v.trim() !== ''))
    .map((r) => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
}

function parseCoords(s) {
  if (!s) return null;
  const n = String(s).match(/-?\d+(?:\.\d+)?/g);
  if (!n || n.length < 2) return null;
  const lat = +n[0], lon = +n[1];
  if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  return [lat, lon];
}
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
function km([a, b], [c, d]) {
  const R = 6371, r = Math.PI / 180;
  const x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function legMode(how) {
  const h = norm(how);
  if (h.startsWith('avion')) return 'avion';
  if (h.startsWith('auto') || h.startsWith('voiture')) return 'auto';
  if (h.includes('train de nuit')) return 'nuit';
  return 'train';
}

function buildModel(lieux, trajet, liens) {
  // stops = route in order; hubs = unique hub names (Paris twice -> one hub)
  const stops = trajet.map((r) => ({ order: +r['Ordre'] || 0, name: r["Port d'attache"], nights: +r['Nuits'] || 0, at: parseCoords(r['Coordonnées']), how: r['Comment on y arrive'] || '' }))
    .filter((s) => s.name && s.at).sort((a, b) => a.order - b.order);
  stops.forEach((s, i) => { s.mode = legMode(s.how); s.seq = i + 1; });
  const hubs = [];
  for (const s of stops) {
    let h = hubs.find((x) => norm(x.name) === norm(s.name));
    if (!h) { h = { name: s.name, at: s.at, seqs: [], nights: [], places: [], how: [] }; hubs.push(h); }
    h.seqs.push(s.seq); h.nights.push(s.nights); h.how.push(s.how);
  }
  hubs.forEach((h, i) => { h.index = i; h.label = h.seqs.join('·'); });

  const linkRows = liens.map((r) => ({ url: r['Lien'], desc: r['Description'] || '', places: (r['Lieux'] || '').split(/[,;]/).map(norm).filter(Boolean) })).filter((l) => l.url);

  const other = { name: 'Ailleurs', places: [], other: true };
  const places = [], skipped = [];
  for (const r of lieux) {
    const name = r['Lieu']; if (!name) continue;
    if (norm(r['Statut']) === 'non') continue;
    const at = parseCoords(r['Coordonnées']);
    if (!at) { skipped.push(name); continue; }
    let best = null, bd = Infinity;
    for (const h of hubs) { const d = km(at, h.at); if (d < bd) { bd = d; best = h; } }
    const p = { name, at, statut: r['Statut'] || '', type: r['Type'] || '', photo: r['Photo'] || '', note: r['Note'] || '', by: r['Ajouté par'] || '',
      links: linkRows.filter((l) => l.places.includes(norm(name))), dist: Math.round(bd) };
    const home = best && bd <= RADIUS_KM ? best : other;
    p.hub = home; p.near = best ? best.name : ''; home.places.push(p); places.push(p);
  }
  // order places in each group: incontournable first, then by distance, then name
  const rank = (p) => (norm(p.statut) === 'incontournable' ? 0 : 1);
  for (const g of [...hubs, other]) {
    g.places.sort((a, b) => rank(a) - rank(b) || a.dist - b.dist || a.name.localeCompare(b.name, 'fr'));
    g.places.forEach((p, i) => { p.num = g.other ? `A${i + 1}` : `${g.label.split('·')[0]}.${i + 1}`; });
  }
  const unmatched = [];
  const known = new Set(places.map((p) => norm(p.name)));
  for (const l of linkRows) for (const n of l.places) if (!known.has(n)) unmatched.push(n);
  const totalNights = stops.reduce((s, x) => s + x.nights, 0);
  return { stops, hubs, other, places, skipped, unmatched, totalNights };
}

if (typeof module !== 'undefined') module.exports = { parseCSV, parseCoords, buildModel, km, norm };

const BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRc8gRtaQjVgveoRwE9VsKfz2v-PgorJTpPQTK2xEJf8-bBGtIBbeWJ1RNLJUKxvOn0LT2t2AfbwPhX/pub';
const GID = { lieux: '509099679', trajet: '179035661', liens: '305479065' };
const PALETTE = ['#1f5f99', '#b5541c', '#2e7d4f', '#7a4a9e', '#0f7f80', '#9b2335', '#8a6a12', '#3d5a80'];
const GREY = '#8b918e';
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const colorOf = (g) => (g.other ? GREY : PALETTE[g.index % PALETTE.length]);

const map = L.map('map', { zoomControl: true }).setView([45.2, 9.5], 5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd', maxZoom: 19 }).addTo(map);
let layers = { route: L.layerGroup().addTo(map), hubs: L.layerGroup().addTo(map), places: L.layerGroup().addTo(map), other: L.layerGroup().addTo(map) };
let model = null, markerOf = new Map();

async function getCSV(gid) {
  const r = await fetch(`${BASE}?gid=${gid}&single=true&output=csv&t=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return parseCSV(await r.text());
}
async function load() {
  $('sum').textContent = 'Chargement…';
  try {
    const [l, t, k] = await Promise.all([getCSV(GID.lieux), getCSV(GID.trajet), getCSV(GID.liens)]);
    model = buildModel(l, t, k);
    render();
    $('stamp').textContent = 'Feuille lue à ' + new Date().toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' }) + ' (un changement peut prendre environ 5 minutes à apparaître)';
  } catch (e) {
    $('sum').textContent = '';
    $('panel').innerHTML = `<div class="msg">Impossible de lire la feuille Google (${esc(e.message)}). Vérifier qu'elle est toujours publiée sur le Web, puis cliquer sur Recharger.</div>`;
  }
}

function render() {
  const m = model;
  Object.values(layers).forEach((g) => g.clearLayers()); markerOf.clear();
  $('sum').textContent = `Brouillon de trajet · ${m.totalNights} nuits`;
  $('route').innerHTML = m.stops.map((s) => { const h = m.hubs.find((x) => norm(x.name) === norm(s.name));
    return `<button class="chip" data-hub="${h.index}"><b style="background:${colorOf(h)}">${s.seq}</b>${esc(s.name)} · ${s.nights} n.</button>`; }).join('');

  // route lines
  for (let i = 1; i < m.stops.length; i++) {
    const a = m.stops[i - 1], b = m.stops[i];
    const style = b.mode === 'avion' ? { color: '#666', weight: 3, dashArray: '2 8' } : b.mode === 'nuit' ? { color: '#444', weight: 4, dashArray: '12 8' } : { color: '#1c2422', weight: 3.5, opacity: .75 };
    L.polyline([a.at, b.at], style).bindTooltip(`${a.name} → ${b.name} : ${b.how}`).addTo(layers.route);
    if (b.mode === 'auto') L.marker([(a.at[0] + b.at[0]) / 2, (a.at[1] + b.at[1]) / 2], { icon: L.divIcon({ className: '', html: '<div class="carpin">🚗</div>', iconSize: [30, 30] }), interactive: false }).addTo(layers.route);
  }
  // hubs
  for (const h of m.hubs) {
    const size = 34, html = `<div class="hubpin" style="width:${size}px;height:${size}px;background:${colorOf(h)}">${esc(h.label)}</div>`;
    L.marker(h.at, { icon: L.divIcon({ className: '', html, iconSize: [size, size] }), zIndexOffset: 1000 })
      .bindTooltip(`${h.name} · ${h.nights.join(' + ')} n.`, { direction: 'top', offset: [0, -16] })
      .on('click', () => openGroup(h.index, true)).addTo(layers.hubs);
  }
  // places
  for (const p of m.places) {
    const g = p.hub, must = norm(p.statut) === 'incontournable';
    const mk = L.circleMarker(p.at, { radius: must ? 8 : 6, color: '#fff', weight: must ? 3 : 2, fillColor: colorOf(g), fillOpacity: 1 })
      .bindTooltip(`${p.num} ${p.name}`, { direction: 'top', offset: [0, -6] })
      .bindPopup(() => popupHtml(p), { maxWidth: 240 })
      .on('click', () => highlight(p, false));
    mk.addTo(g.other ? layers.other : layers.places); markerOf.set(p, mk);
  }
  // panel
  let html = '';
  if (m.skipped.length) html += `<div class="warn">Sans coordonnées (pas sur la carte) : ${m.skipped.map(esc).join(', ')}</div>`;
  if (m.unmatched.length) html += `<div class="warn">Dans l'onglet Liens, nom introuvable dans Lieux : ${[...new Set(m.unmatched)].map(esc).join(', ')}</div>`;
  for (const g of [...m.hubs, m.other]) {
    if (!g.places.length && g.other) continue;
    const meta = g.other ? 'Lieux à plus de 40 km de tous les ports d’attache' : `${g.nights.join(' + ')} n. · ${esc(g.how.filter(Boolean).join(' / '))}`;
    html += `<details class="group" id="g${g.other ? 'o' : g.index}" ${g.other ? 'data-other="1"' : ''}>
      <summary><span class="badge" style="background:${colorOf(g)}">${g.other ? 'A' : esc(g.label)}</span><div><h2>${esc(g.name)}</h2><div class="meta">${meta}</div></div><span class="count">${g.places.length} lieux</span></summary>
      <div class="cards">${g.places.map((p) => cardHtml(p)).join('')}</div></details>`;
  }
  $('panel').innerHTML = html;
  $('panel').querySelectorAll('.card .top').forEach((el) => el.addEventListener('click', () => { const p = m.places[+el.closest('.card').dataset.i]; highlight(p, true); }));
  $('panel').querySelectorAll('[data-go]').forEach((el) => el.addEventListener('click', () => { const p = m.places[+el.dataset.go]; highlight(p, true); }));
  $('panel').querySelectorAll('.group > summary').forEach((el) => el.addEventListener('click', () => {
    const d = el.parentElement; if (!d.open) setTimeout(() => fitGroup(d.dataset.other ? m.other : m.hubs[+d.id.slice(1)]), 0); }));
  $('route').querySelectorAll('.chip').forEach((el) => el.addEventListener('click', () => openGroup(+el.dataset.hub, true)));
  toggleOther();
  fitAll();
}

function linkLabel(u) {
  try { const h = new URL(u).hostname.replace(/^www\./, ''); return h.includes('facebook') ? 'Facebook' : h.includes('youtu') ? 'YouTube' : h.includes('instagram') ? 'Instagram' : h; } catch { return 'Lien'; }
}
function cardHtml(p) {
  const i = model.places.indexOf(p), must = norm(p.statut) === 'incontournable';
  const where = p.hub.other ? `<p style="color:var(--muted);font-size:14px">À ${p.dist} km de ${esc(p.near)}</p>` : '';
  const q = encodeURIComponent(p.name);
  return `<article class="card" id="c${i}" data-i="${i}">
    <div class="top"><span class="badge" style="background:${colorOf(p.hub)}">${esc(p.num)}</span><h3>${esc(p.name)}</h3><span class="st ${must ? 'must' : ''}">${esc(p.statut)}${p.type ? ' · ' + esc(p.type) : ''}</span></div>
    ${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(p.name)}" loading="lazy" onerror="this.remove()">` : ''}
    ${p.note ? `<p>${esc(p.note)}</p>` : ''}${where}
    ${p.links.length ? `<div class="links">${p.links.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.desc || l.url)} <span>· ${linkLabel(l.url)} ↗</span></a>`).join('')}</div>` : ''}
    <div class="acts"><button class="btn" data-go="${i}">◎ Voir sur la carte</button>
      <a class="btn" href="https://www.google.com/search?tbm=isch&q=${q}" target="_blank" rel="noopener">Photos ↗</a>
      <a class="btn" href="https://www.google.com/maps/search/?api=1&query=${p.at[0]},${p.at[1]}" target="_blank" rel="noopener">Google Maps ↗</a></div>
  </article>`;
}
function popupHtml(p) {
  const i = model.places.indexOf(p);
  return `${p.photo ? `<img src="${esc(p.photo)}" alt="" onerror="this.remove()">` : ''}<b>${esc(p.num)} · ${esc(p.name)}</b>${p.note ? `<br>${esc(p.note)}` : ''}<br><button class="btn pbtn" onclick="showCard(${i})">Voir la fiche</button>`;
}
function openGroup(idx, fit) {
  const d = $('g' + idx); if (!d) return;
  d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (fit) fitGroup(model.hubs[idx]);
}
function showCard(i) {
  const p = model.places[i], d = $('g' + (p.hub.other ? 'o' : p.hub.index)); d.open = true;
  const c = $('c' + i); document.querySelectorAll('.card.hl').forEach((x) => x.classList.remove('hl'));
  c.classList.add('hl'); c.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function highlight(p, fly) {
  showCard(model.places.indexOf(p));
  const mk = markerOf.get(p);
  if (p.hub.other && !$('showOther').checked) { $('showOther').checked = true; toggleOther(); }
  if (fly) { map.flyTo(p.at, Math.max(map.getZoom(), 11), { duration: .8 }); setTimeout(() => mk.openPopup(), 850); }
}
function fitGroup(g) {
  const pts = g.places.map((p) => p.at).concat(g.at ? [g.at] : []);
  if (pts.length) map.flyToBounds(L.latLngBounds(pts).pad(0.15), { duration: .8, maxZoom: 12 });
}
function fitAll() {
  const pts = model.stops.map((s) => s.at);
  if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.12));
}
function toggleOther() {
  const on = $('showOther').checked;
  if (on) map.addLayer(layers.other); else map.removeLayer(layers.other);
  const g = document.querySelector('[data-other]'); if (g) g.style.display = on ? '' : 'none';
}
$('showOther').addEventListener('change', toggleOther);
$('reload').addEventListener('click', load);
load();
</script>
